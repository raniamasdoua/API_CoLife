spring.datasource.url=jdbc:h2:mem:colifetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Pas d'issuer-uri en test : un JwtDecoder de test est fourni par TestSecurityConfig
# (évite tout appel réseau vers Keycloak au démarrage du contexte).

cors.allowed-origins=http://localhost:5173

logging.level.org.springframework.security=WARN