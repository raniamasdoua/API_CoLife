spring.application.name=api
spring.profiles.active=dev

# OIDC Resource Server : les tokens sont émis et signés par Keycloak.
# Le backend télécharge automatiquement les clés publiques (JWKS) depuis l'issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/colife}

logging.level.root=INFO
logging.level.com.example.api=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n

# Swagger / OpenAPI (springdoc)
# UI: /swagger-ui/index.html | spec JSON: /v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha