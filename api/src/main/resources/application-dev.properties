spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:colife_db}
spring.datasource.username=${DB_USER:colife_user}
spring.datasource.password=${DB_PASSWORD:colife_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# Exécuter data.sql APRÈS que Hibernate ait créé les tables (sinon activity_types n'existe pas encore).
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always