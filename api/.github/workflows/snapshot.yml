name: Snapshot Build

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Compute snapshot version
        run: |
          BASE_VERSION=$(./scripts/next-version.sh)
          SNAPSHOT_VERSION="${BASE_VERSION#v}-SNAPSHOT.${GITHUB_RUN_NUMBER}"
          echo "SNAPSHOT_VERSION=$SNAPSHOT_VERSION" >> $GITHUB_ENV
          echo "Version: $SNAPSHOT_VERSION"

      - name: Set Maven version
        run: ./mvnw -B versions:set -DnewVersion=${SNAPSHOT_VERSION} -DgenerateBackupPoms=false

      - name: Build project
        run: ./mvnw -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-colife-${{ env.SNAPSHOT_VERSION }}
          path: target/*.jar