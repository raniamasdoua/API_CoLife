services:
  postgres:
    image: postgres:15
    container_name: colife_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: colife_keycloak
    command: start-dev --import-realm
    environment:
      # Compte admin de la console Keycloak (http://localhost:8081)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # En dev : stockage embarqué (H2), pas de base dédiée requise.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      - mailpit
    volumes:
      # Le realm "colife" est importé automatiquement au démarrage.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # Faux serveur SMTP de développement : capture les emails (vérification de compte,
  # reset password…) sans les envoyer réellement. UI web sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: colife_mailpit
    ports:
      - "8025:8025"   # interface web (lire les emails)
      - "1025:1025"   # port SMTP (utilisé par Keycloak via le réseau Docker)

  sonarqube:
    image: sonarqube:community
    container_name: colife_sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
