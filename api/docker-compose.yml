services:
  postgres:
    image: postgres:15
    container_name: colife_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: colife_db
      POSTGRES_USER: colife_user
      POSTGRES_PASSWORD: colife_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: