name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Compute version
        id: version
        run: |
          VERSION=$(./api/scripts/next-version.sh)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Generate changelog
        run: ./api/scripts/generate-changelog.sh $VERSION

      - name: Update Maven version
        run: /api/mvnw -B versions:set -DnewVersion=${VERSION#v} -DgenerateBackupPoms=false

      - name: Build project
        run: /api/mvnw -B clean package

      - name: Commit changelog + version
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md pom.xml
          git commit -m "chore(release): $VERSION" || echo "Nothing to commit"

      - name: Push changes
        run: git push

      - name: Create tag
        run: |
          git tag $VERSION
          git push origin $VERSION

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $VERSION target/*.jar \
            --title "$VERSION" \
            --notes-file CHANGELOG.md